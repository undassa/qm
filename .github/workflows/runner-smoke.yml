# приватного раннера не тарифицируются, и вопрос был, касается ли отсечка их.
name: runner-smoke

on:
  push:
    branches: [harness]

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    steps:
      - run: echo "раннер жив - $(uname -sr)"
