name: проверки

on:
  push:
    branches: [main, harness]
  pull_request:

jobs:
  rust:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: server-rs
    # База — в самом раннере, а не блоком `services:`. `services:` просит докер
    # ВНУТРИ раннера, а дать его можно лишь пробросив сокет хоста — то есть
    # отдав раннеру весь докер машины, где стоят `mh-web` и общая база. Адрес
    # тот же, что давал контейнер службы.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      # Тесты, которым нужна база, в обычном прогоне помечены `ignored` — видно, что
      # их не гоняли. Здесь база есть, и они идут отдельным шагом.
      - run: cargo test --release --locked -- --ignored
        env:
          MH_TEST_DB_URL: postgres://postgres@localhost:5432/postgres
      # ЗАПРЕТ, А НЕ ХРАПОВИК. Линия «не расти» — тот же долг: она разрешала
      # семьдесят девять предупреждений и считала их по строкам вывода, а вывод
      # в CI раскрашен, и `grep '^warning'` находил в нём НОЛЬ при семидесяти
      # семи. Проверка, которая всегда зелена, — украшение.
      - run: cargo clippy --release --locked --all-targets -- -D warnings

  web:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Половина харнеса живёт в базе — правила гейтов, их пробы, ступени лестницы и
  # предметы ступеней. `cargo test` не видит её вовсе, и ровно так пробы ступеней
  # 9 и 10 сгнили незамеченными: сломались они не от правки, а от того, что
  # состояние набора изменилось. Единственный сторож этой половины — самотест, и
  # пока его запускает человек по памяти, сторожа нет.
  #
  # Прогон требует живого экземпляра с набором: правила меряют набор, а не схему.
  # Без секретов работа пропускается, а не падает: молчаливо красная проверка,
  # которую все привыкли видеть красной, хуже отсутствующей.
  selftest:
    runs-on: [self-hosted, linux, x64]
    # Секрет в условии шага GitHub не принимает и отвергает из-за этого ВЕСЬ файл:
    # ни одна работа не запускалась. Условие читает признак работы — есть секрет
    # или нет, — а сам секрет в переменные каждого шага не попадает.
    env:
      HAS_EDGE_SECRET: ${{ secrets.MH_EDGE_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      # `id` и ссылки на него — только латиницей: имена шагов GitHub проверяет
      # образцом `[A-Za-z_][A-Za-z0-9_-]*`, и кириллическое имя роняет разбор
      # ВСЕГО файла — вместе с работами, которые к нему отношения не имеют.
      # Заголовки работ при этом остаются какими угодно.
      - if: ${{ env.HAS_EDGE_SECRET == 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ env.HAS_EDGE_SECRET == 'true' }}
        run: cargo build --release --locked --bin mh
        working-directory: server-rs
      - if: ${{ env.HAS_EDGE_SECRET == 'true' }}
        run: |
          export PATH="$PWD/server-rs/target/release:$PATH"
          ./scripts/selftest.sh
        env:
          MH_URL: ${{ secrets.MH_URL }}
          MH_EDGE_SECRET: ${{ secrets.MH_EDGE_SECRET }}
          MH_PROJECT: ${{ secrets.MH_PROJECT }}
          MH_PRINCIPAL: ${{ secrets.MH_PRINCIPAL }}
      - if: ${{ env.HAS_EDGE_SECRET != 'true' }}
        run: |
          echo "::notice::самотест пропущен: секретов живого экземпляра нет."
          echo "Заведите MH_URL, MH_EDGE_SECRET, MH_PROJECT, MH_PRINCIPAL —"
          echo "иначе половину харнеса, живущую в базе, не сторожит ничто."
